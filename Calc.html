<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>Calc Page</title>
        <link rel="StyleSheet" href="style.css">
    </head>
    <body>
      <header class="page2">
        <page2head>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calc.html">Calc</a></li>
            </ul>
        </page2head>
    </header>
        <page2sec class="sec2">
            <div class="calculatorpart">
                <h1>Calculate</h1>
                <input type="text" placeholder="0" id="inputBox">
                <div>
                     <button class="aribtns">AC</button>
                     <button class="aribtns">DEL</button>
                     <button class="aribtns">%</button>
                     <button class="aribtns">/</button>
                </div>
                <div>
                     <button class="btn1">7</button>
                     <button class="btn1">8</button>
                     <button class="btn1">9</button>
                     <button class="aribtns">*</button>
                </div>
                <div>
                     <button class="btn1">4</button>
                     <button class="btn1">5</button>
                     <button class="btn1">6</button>
                     <button class="aribtns">-</button>
                 </div>
                 <div>
                     <button class="btn1">1</button>
                     <button class="btn1">2</button>
                     <button class="btn1">3</button>
                     <button class="aribtns">+</button>
                     <button class="equalbtn">=</button>
                </div>
            </div>
            <div class="container">
                <h2>Hey, Do you wanna hear a maths Fact?</h2>
                <button id="ask-button">Yes, why not</button>
                <div id="answer-box">
                    <p>Every odd number contains the letter E</p>
                </div>
            </div>
        </page2sec>
        <script src="script.js"></script>
    </body>
</html>
